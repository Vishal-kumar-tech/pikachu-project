<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pikachu Landing Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">

        <nav>
            <img src="./pokemon-logo.png" alt="Pokemon logo">
            <span><img src="./menu-line.png" alt="Menu"></span>
        </nav>

        <div class="content">

            <div class="left">
                <h6>POKEMON GEN 1</h6>

                <h1>Pikachu</h1>

                <p>
                    Pikachu is an Electric-type Pokémon introduced in Generation I.
                    Pikachu are small, chubby, and incredibly cute mouse-like Pokémon.
                    They are almost completely covered by yellow fur.
                </p>

                <div class="counter">
                    <span class="line"></span>
                    <b>01 / 08</b>
                </div>
            </div>

            <div class="right">
                <img src="./pikachu.png" alt="Pikachu">
            </div>

            <div class="dots">
                <span class="dot active"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>

            <div class="pokeball"></div>

        </div>
    </div>
</body>
</html>
</html>
